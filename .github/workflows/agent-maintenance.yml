name: Agent maintenance policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  agent-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check agent and skill synchronization
        run: >-
          perl scripts/check-agent-maintenance.pl
          --base "${{ github.event.pull_request.base.sha }}"
